<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Óptico Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para las fórmulas matemáticas (reemplazo de mathtext) */
        .frac {
            display: inline-block;
            text-align: center;
            vertical-align: middle;
            margin: 0 0.2em;
            font-size: 1.1em;
        }
        .frac > span {
            display: block;
            padding: 0.1em;
        }
        .frac > span.bottom {
            border-top: 1px solid currentColor;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Ocultar barra de desplazamiento en el panel lateral */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#FAFAFA] text-[#2C3E50] h-screen flex flex-col font-sans overflow-hidden">

    <!-- Encabezado -->
    <header class="bg-[#2C3E50] text-white p-3 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold">Laboratorio Virtual de Óptica Geométrica</h1>
        <span class="text-sm bg-[#34495E] px-3 py-1 rounded-full">v4 (Web Edition)</span>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- Zona Izquierda: Gráficos (Canvas) -->
        <section class="flex-1 flex flex-col p-4 gap-4 overflow-hidden">
            
            <!-- Banco Óptico Principal -->
            <div class="flex-[3] bg-white border border-[#BDC3C7] rounded-lg shadow-sm relative overflow-hidden flex flex-col">
                <div class="bg-gray-100 px-3 py-2 border-b border-gray-200 text-sm font-bold flex justify-between">
                    <span>Riel Óptico</span>
                    <span id="bench-info" class="text-gray-500 font-normal">f=10.0 cm | so=25.0 cm | si=16.7 cm | M=-0.67</span>
                </div>
                <div class="flex-1 relative">
                    <canvas id="benchCanvas"></canvas>
                </div>
            </div>

            <!-- Zona Inferior: Vistas Frontales -->
            <div class="flex-[2] flex gap-4 min-h-0">
                <!-- Objeto Original -->
                <div class="flex-1 bg-white border border-[#27AE60] border-2 rounded-lg shadow-sm flex flex-col">
                    <div class="text-center text-[#27AE60] font-bold text-sm py-1 bg-green-50 border-b border-green-200">
                        OBJETO (Acetato original)
                    </div>
                    <div class="flex-1 relative p-2 flex justify-center items-center">
                        <canvas id="objCanvas" width="200" height="200" class="max-w-[200px] max-h-[200px] border border-gray-100 shadow-inner bg-white"></canvas>
                    </div>
                </div>

                <!-- Pantalla -->
                <div class="flex-[1.5] bg-white border border-[#BDC3C7] border-2 rounded-lg shadow-sm flex flex-col">
                    <div id="screen-title" class="text-center font-bold text-sm py-1 bg-gray-50 border-b border-gray-200">
                        PANTALLA
                    </div>
                    <div class="flex-1 relative p-2 flex justify-center items-center overflow-hidden">
                        <canvas id="screenCanvas" width="300" height="300" class="max-w-[300px] max-h-[300px] bg-white shadow-md transition-transform duration-200"></canvas>
                    </div>
                    <div id="screen-subtitle" class="text-center text-xs text-gray-500 py-1 bg-gray-50 border-t border-gray-200">
                        -
                    </div>
                </div>
            </div>
        </section>

        <!-- Zona Derecha: Controles y Panel -->
        <aside class="w-full lg:w-96 bg-white border-l border-[#BDC3C7] flex flex-col shadow-lg z-10">
            
            <!-- Controles -->
            <div class="p-4 border-b border-[#BDC3C7] bg-gray-50">
                <h2 class="text-sm font-bold text-[#2980B9] mb-3 uppercase tracking-wider">Configuración del Sistema</h2>
                
                <!-- Sliders -->
                <div class="space-y-4 mb-4">
                    <div>
                        <div class="flex justify-between text-xs font-semibold mb-1">
                            <span>Distancia objeto (so)</span>
                            <span id="val-so">25.0 cm</span>
                        </div>
                        <input type="range" id="sl-so" min="5" max="60" step="0.5" value="25" class="w-full accent-[#2C3E50]">
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-semibold mb-1">
                            <span>Distancia focal (|f|)</span>
                            <span id="val-f">10.0 cm</span>
                        </div>
                        <input type="range" id="sl-f" min="5" max="30" step="0.5" value="10" class="w-full accent-[#2980B9]">
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-semibold mb-1">
                            <span>Posición pantalla (xs)</span>
                            <span id="val-xs">40.0 cm</span>
                        </div>
                        <input type="range" id="sl-xs" min="0" max="80" step="0.5" value="40" class="w-full accent-[#BDC3C7]">
                    </div>
                </div>

                <!-- Selectores -->
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold mb-1 text-gray-600">Tipo de Lente</label>
                        <select id="sel-lens" class="w-full p-1.5 text-sm border rounded bg-white focus:ring-2 outline-none">
                            <option value="Convexo">Convexo</option>
                            <option value="Concavo">Cóncavo</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold mb-1 text-gray-600">Objeto (Acetato)</label>
                        <select id="sel-obj" class="w-full p-1.5 text-sm border rounded bg-white focus:ring-2 outline-none">
                            <option value="Letra F">Letra F</option>
                            <option value="Flecha">Flecha</option>
                            <option value="Letra J">Letra J</option>
                            <option value="Auto Sedan" selected>Auto Sedán</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Panel de Información (Pestañas) -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="flex border-b border-[#BDC3C7] bg-gray-100 text-sm">
                    <button class="tab-btn flex-1 py-2 font-semibold text-[#2980B9] bg-white border-t-2 border-[#2980B9]" data-tab="datos">Datos</button>
                    <button class="tab-btn flex-1 py-2 font-semibold text-gray-500 hover:bg-gray-50 border-t-2 border-transparent" data-tab="analisis">Análisis</button>
                    <button class="tab-btn flex-1 py-2 font-semibold text-gray-500 hover:bg-gray-50 border-t-2 border-transparent" data-tab="ecuaciones">Ecuaciones</button>
                </div>
                
                <div class="flex-1 overflow-y-auto p-4 no-scrollbar bg-white" id="tab-content">
                    <!-- El contenido de las pestañas se inyecta por JS -->
                </div>
            </div>
        </aside>
    </main>

    <!-- Lógica JavaScript -->
    <script>
        // ══════════════════════════════════════════════════════════
        // CONFIGURACIÓN Y ESTADO
        // ══════════════════════════════════════════════════════════
        const ESTILO = {
            color_r1: '#E74C3C',
            color_r2: '#2980B9',
            color_r3: '#27AE60',
            color_virtual: '#F39C12',
            color_lente: '#85C1E9',
            color_luz_fuente: 'rgba(255, 245, 157, 0.3)',
            color_acetato: '#7F8C8D',
            color_pantalla: '#BDC3C7',
            color_eje: '#2C3E50',
            color_imagen: '#C0392B'
        };

        const state = {
            so: 25.0,
            fMag: 10.0,
            xs: 40.0,
            lens: 'Convexo',
            obj: 'Auto Sedan',
            tab: 'datos',
            physics: {} // Almacenará los resultados calculados
        };

        // Elementos DOM
        const benchCanvas = document.getElementById('benchCanvas');
        const objCanvas = document.getElementById('objCanvas');
        const screenCanvas = document.getElementById('screenCanvas');
        const ctxBench = benchCanvas.getContext('2d');
        const ctxObj = objCanvas.getContext('2d');
        const ctxScreen = screenCanvas.getContext('2d');

        // Controles DOM
        const inputs = {
            so: document.getElementById('sl-so'),
            f: document.getElementById('sl-f'),
            xs: document.getElementById('sl-xs'),
            lens: document.getElementById('sel-lens'),
            obj: document.getElementById('sel-obj')
        };
        const labels = {
            so: document.getElementById('val-so'),
            f: document.getElementById('val-f'),
            xs: document.getElementById('val-xs')
        };

        // ══════════════════════════════════════════════════════════
        // GENERADORES DE ACETATOS (Gráficos Vectoriales en Canvas)
        // ══════════════════════════════════════════════════════════
        function drawShape(ctx, shapeName, size) {
            ctx.clearRect(0, 0, size, size);
            ctx.strokeStyle = '#222';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const s = size;
            const t = s / 15; // Grosor base
            ctx.lineWidth = t;

            ctx.beginPath();
            
            if (shapeName === 'Letra F') {
                ctx.moveTo(0.23*s, 0.1*s); ctx.lineTo(0.23*s, 0.9*s);
                ctx.moveTo(0.23*s, 0.1*s); ctx.lineTo(0.80*s, 0.1*s);
                ctx.moveTo(0.23*s, 0.5*s); ctx.lineTo(0.66*s, 0.5*s);
            } 
            else if (shapeName === 'Flecha') {
                ctx.moveTo(0.15*s, 0.85*s); ctx.lineTo(0.85*s, 0.15*s);
                ctx.moveTo(0.85*s, 0.15*s); ctx.lineTo(0.85*s, 0.45*s);
                ctx.moveTo(0.85*s, 0.15*s); ctx.lineTo(0.55*s, 0.15*s);
            }
            else if (shapeName === 'Letra J') {
                ctx.moveTo(0.30*s, 0.1*s); ctx.lineTo(0.72*s, 0.1*s);
                ctx.moveTo(0.60*s, 0.1*s); ctx.lineTo(0.60*s, 0.70*s);
                ctx.arc(0.40*s, 0.70*s, 0.20*s, 0, Math.PI);
            }
            else if (shapeName === 'Auto Sedan') {
                ctx.lineWidth = s / 20;
                // Ruedas
                ctx.arc(0.25*s, 0.7*s, 0.1*s, 0, Math.PI*2); ctx.stroke(); ctx.beginPath();
                ctx.arc(0.75*s, 0.7*s, 0.1*s, 0, Math.PI*2); ctx.stroke(); ctx.beginPath();
                
                // Contorno
                ctx.moveTo(0.1*s, 0.7*s);
                ctx.lineTo(0.1*s, 0.55*s); // Frente
                ctx.lineTo(0.3*s, 0.55*s); // Capo
                ctx.lineTo(0.4*s, 0.4*s);  // Parabrisas
                ctx.lineTo(0.7*s, 0.4*s);  // Techo
                ctx.lineTo(0.85*s, 0.55*s);// Trasero arriba
                ctx.lineTo(0.9*s, 0.55*s); // Maletero
                ctx.lineTo(0.9*s, 0.7*s);  // Trasera baja
                ctx.closePath();
                ctx.stroke(); ctx.beginPath();

                // Chasis inferior
                ctx.moveTo(0.1*s, 0.7*s); ctx.lineTo(0.15*s, 0.7*s);
                ctx.moveTo(0.35*s, 0.7*s); ctx.lineTo(0.65*s, 0.7*s);
                ctx.moveTo(0.85*s, 0.7*s); ctx.lineTo(0.9*s, 0.7*s);
                
                // Ventanas y Pilar
                ctx.moveTo(0.32*s, 0.55*s); ctx.lineTo(0.83*s, 0.55*s);
                ctx.moveTo(0.55*s, 0.4*s); ctx.lineTo(0.55*s, 0.7*s);
            }
            ctx.stroke();
        }

        // ══════════════════════════════════════════════════════════
        // MOTOR DE FÍSICA
        // ══════════════════════════════════════════════════════════
        function calculatePhysics() {
            let f = state.lens === 'Convexo' ? state.fMag : -state.fMag;
            let so = state.so;
            
            // Evitar singularidad exacta (objeto en el foco exacto)
            if (Math.abs(so - f) < 0.01) so += 0.02;

            let si = 1.0 / (1.0/f - 1.0/so);
            let M = !isFinite(si) ? 1.0 : -si / so;
            let isReal = si > 0;
            let deltaX = isReal ? Math.abs(state.xs - si) : Infinity;

            state.physics = { so, si, f, M, isReal, deltaX };
        }

        // ══════════════════════════════════════════════════════════
        // FUNCIONES DE DIBUJO (RENDERIZADO)
        // ══════════════════════════════════════════════════════════

        function resizeCanvases() {
            const benchRect = benchCanvas.parentElement.getBoundingClientRect();
            benchCanvas.width = benchRect.width;
            benchCanvas.height = benchRect.height;
        }

        function renderFrontViews() {
            // 1. Dibujar acetato original (fijo, tamaño base)
            drawShape(ctxObj, state.obj, 200);

            // 2. Dibujar proyección en la pantalla
            const sCanvas = screenCanvas;
            const p = state.physics;
            ctxScreen.clearRect(0, 0, sCanvas.width, sCanvas.height);
            
            const titleEl = document.getElementById('screen-title');
            const subEl = document.getElementById('screen-subtitle');
            sCanvas.parentElement.className = "flex-1 relative p-2 flex justify-center items-center overflow-hidden bg-white";

            if (p.isReal) {
                // Imagen Real
                let nitida = p.deltaX < 0.5;
                let sigma = p.deltaX * 1.5; // Factor de difuminado
                
                titleEl.innerText = nitida ? 'PANTALLA — NÍTIDA' : `PANTALLA — BORROSA (Δ=${p.deltaX.toFixed(1)} cm)`;
                titleEl.className = `text-center font-bold text-sm py-1 border-b border-gray-200 text-white ${nitida ? 'bg-[#27AE60]' : 'bg-[#E74C3C]'}`;
                
                let orientacion = p.M < 0 ? 'Invertida' : 'Derecha';
                let tamano = Math.abs(p.M) > 1 ? 'Aumentada' : 'Reducida';
                subEl.innerText = `${orientacion} | ${tamano} | M = ${p.M.toFixed(2)}`;
                
                // Si está demasiado desenfocado, solo mostrar gris
                if (sigma > 25) {
                    ctxScreen.fillStyle = '#E5E7EB';
                    ctxScreen.fillRect(0,0,300,300);
                } else {
                    ctxScreen.save();
                    // Transformaciones para escalar e invertir desde el centro
                    ctxScreen.translate(150, 150);
                    ctxScreen.scale(Math.sign(p.M), Math.sign(p.M)); // Invertir si M es negativo
                    
                    // Aplicar Magnificación visual limitada para que no se salga inmensamente del canvas
                    let visualM = Math.min(Math.max(Math.abs(p.M), 0.2), 3.0);
                    ctxScreen.scale(visualM, visualM);
                    
                    ctxScreen.translate(-100, -100); // 100 es la mitad del tamaño original del dibujo (200)
                    
                    // Aplicar desenfoque (blur nativo de canvas)
                    if (sigma > 0.1) {
                        ctxScreen.filter = `blur(${sigma}px)`;
                    }
                    
                    // Dibujar el acetato modificado
                    drawShape(ctxScreen, state.obj, 200);
                    ctxScreen.restore();
                }
            } else {
                // Imagen Virtual (Sombra difusa)
                titleEl.innerText = 'PANTALLA — Sombra difusa (Imagen virtual)';
                titleEl.className = 'text-center font-bold text-sm py-1 bg-gray-200 text-gray-500 border-b border-gray-300';
                subEl.innerText = 'No proyectable (la luz diverge)';
                
                let sigma = state.xs * 0.5 + 2;
                ctxScreen.save();
                ctxScreen.translate(150, 150);
                let visualM = 0.5 + (state.xs / 100); // Se hace más grande y difusa con la distancia
                ctxScreen.scale(visualM, visualM);
                ctxScreen.translate(-100, -100);
                ctxScreen.filter = `blur(${sigma}px) opacity(40%)`;
                drawShape(ctxScreen, state.obj, 200);
                ctxScreen.restore();
            }
        }

        function renderBench() {
            const w = benchCanvas.width;
            const h = benchCanvas.height;
            const ctx = ctxBench;
            const p = state.physics;

            ctx.clearRect(0, 0, w, h);

            // Mapeo de coordenadas (cm a px)
            // Lente fijo en X = w * 0.6 (para dar espacio al objeto a la izq)
            const lensX_px = w * 0.5;
            const originY_px = h / 2;
            const scale = w / 140; // 140 cm totales visibles aprox

            // Helper para convertir coords
            const px = (cm) => lensX_px + (cm * scale);
            const py = (cm) => originY_px - (cm * scale);

            // Actualizar header del banco
            document.getElementById('bench-info').innerText = 
                `f=${p.f.toFixed(1)} cm | so=${p.so.toFixed(1)} cm | si=${p.si === Infinity ? '∞' : p.si.toFixed(1)} cm | M=${p.M.toFixed(2)}`;

            // 1. Eje Óptico Principal
            ctx.beginPath();
            ctx.moveTo(0, originY_px);
            ctx.lineTo(w, originY_px);
            ctx.strokeStyle = ESTILO.color_eje;
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);

            const h_obj = 10; // Altura objeto en cm visuales
            const x_obj = -p.so;
            
            // 2. Fuente de luz (Fondo amarillo)
            ctx.fillStyle = ESTILO.color_luz_fuente;
            ctx.fillRect(px(x_obj - 20), py(h_obj*1.2), px(x_obj) - px(x_obj - 20), py(-h_obj*1.2) - py(h_obj*1.2));
            
            // Caja fuente
            ctx.fillStyle = '#34495E';
            ctx.fillRect(px(x_obj - 15), py(h_obj*1.5), px(x_obj - 10) - px(x_obj - 15), py(-h_obj*1.5) - py(h_obj*1.5));
            ctx.fillStyle = 'white';
            ctx.font = '10px sans-serif';
            ctx.fillText("Luz", px(x_obj - 14), py(0));

            // Rayos Físicos (Amarillos paralelos)
            ctx.strokeStyle = '#F1C40F';
            ctx.lineWidth = 2;
            for(let y = -h_obj*0.8; y <= h_obj*0.8; y += h_obj*0.4) {
                ctx.beginPath();
                ctx.moveTo(px(x_obj - 10), py(y));
                ctx.lineTo(px(x_obj - 0.5), py(y)); // Llegan hasta acetato
                ctx.stroke();
            }

            // 3. Acetato (Objeto)
            ctx.beginPath();
            ctx.moveTo(px(x_obj), py(-h_obj*1.1));
            ctx.lineTo(px(x_obj), py(h_obj*1.1));
            ctx.strokeStyle = ESTILO.color_acetato;
            ctx.lineWidth = 6;
            ctx.stroke();
            
            // Flecha indicadora objeto real
            drawArrow(ctx, px(x_obj), py(0), px(x_obj), py(h_obj), 'black', 3);
            ctx.fillStyle = 'black';
            ctx.fillText("Objeto", px(x_obj) - 15, py(h_obj + 2));

            // 4. Pantalla
            ctx.beginPath();
            ctx.moveTo(px(state.xs), py(-h_obj*1.5));
            ctx.lineTo(px(state.xs), py(h_obj*1.5));
            ctx.strokeStyle = ESTILO.color_pantalla;
            ctx.lineWidth = 8;
            ctx.stroke();
            ctx.fillStyle = '#7F8C8D';
            ctx.fillText("Pantalla", px(state.xs) + 5, py(h_obj + 2));

            // 5. Focos
            ctx.fillStyle = 'black';
            ctx.fillRect(px(p.f)-2, py(0)-2, 4, 4);
            ctx.fillText("F", px(p.f)-3, py(-1.5));
            ctx.fillRect(px(-p.f)-2, py(0)-2, 4, 4);
            ctx.fillText("F'", px(-p.f)-3, py(-1.5));

            // 6. Trazado de Rayos de Construcción (Desde la punta del objeto)
            if (isFinite(p.si)) {
                let x_end = Math.max(px(p.si), px(state.xs)) + 50; // Hasta dónde dibujar
                
                let pt_obj = {x: x_obj, y: h_obj};
                let pt_lente_r1 = {x: 0, y: h_obj};
                let pt_img = {x: p.si, y: p.M * h_obj};

                // Rayo 1 (Rojo): Paralelo -> Foco
                ctx.strokeStyle = ESTILO.color_r1; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px(pt_obj.x), py(pt_obj.y));
                ctx.lineTo(px(pt_lente_r1.x), py(pt_lente_r1.y));
                // Proyección real
                let m1 = (0 - h_obj) / (p.f - 0); // pendiente
                let y1_end = h_obj + m1 * (x_end/scale);
                ctx.lineTo(x_end, py(y1_end));
                ctx.stroke();

                // Rayo 2 (Azul): Pasa por centro óptico
                ctx.strokeStyle = ESTILO.color_r2;
                ctx.beginPath();
                ctx.moveTo(px(pt_obj.x), py(pt_obj.y));
                let m2 = (0 - h_obj) / (0 - x_obj);
                let y2_end = h_obj + m2 * (x_end/scale);
                ctx.lineTo(x_end, py(y2_end));
                ctx.stroke();

                // Rayo 3 (Verde): Pasa por foco anterior -> Paralelo
                ctx.strokeStyle = ESTILO.color_r3;
                let m3 = (0 - h_obj) / (-p.f - x_obj);
                let y_lente_r3 = h_obj + m3 * (0 - x_obj);
                
                // Solo dibujar si no es un ángulo extremo
                if (Math.abs(y_lente_r3) < h_obj * 3) {
                    ctx.beginPath();
                    ctx.moveTo(px(pt_obj.x), py(pt_obj.y));
                    ctx.lineTo(px(0), py(y_lente_r3));
                    ctx.lineTo(x_end, py(y_lente_r3));
                    ctx.stroke();
                }

                // --- Imagen e Intersecciones Virtuales ---
                if (p.isReal) {
                    // Dibujar flecha imagen
                    drawArrow(ctx, px(p.si), py(0), px(p.si), py(pt_img.y), ESTILO.color_imagen, 3);
                    // Estrella en intersección
                    ctx.fillStyle = 'white'; ctx.strokeStyle = ESTILO.color_imagen;
                    ctx.beginPath(); ctx.arc(px(p.si), py(pt_img.y), 4, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
                } else {
                    // Extensiones virtuales (hacia atrás)
                    ctx.strokeStyle = ESTILO.color_r1; ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.moveTo(px(0), py(h_obj)); ctx.lineTo(px(p.si), py(pt_img.y)); ctx.stroke();
                    
                    ctx.strokeStyle = ESTILO.color_r2;
                    ctx.beginPath(); ctx.moveTo(px(0), py(0)); ctx.lineTo(px(p.si), py(pt_img.y)); ctx.stroke();

                    if (Math.abs(y_lente_r3) < h_obj * 3) {
                        ctx.strokeStyle = ESTILO.color_r3;
                        ctx.beginPath(); ctx.moveTo(px(0), py(y_lente_r3)); ctx.lineTo(px(p.si), py(y_lente_r3)); ctx.stroke();
                    }
                    ctx.setLineDash([]);

                    // Flecha imagen virtual (punteada)
                    ctx.setLineDash([3, 3]);
                    drawArrow(ctx, px(p.si), py(0), px(p.si), py(pt_img.y), ESTILO.color_virtual, 3);
                    ctx.setLineDash([]);
                    ctx.fillStyle = ESTILO.color_virtual;
                    ctx.fillText("Virtual", px(p.si) - 15, py(pt_img.y + 2*Math.sign(pt_img.y)));
                }
            }

            // 7. Lente (Grosor variable según foco)
            let factor = 10.0 / Math.abs(p.f); // Base f=10
            let tCentro = state.lens === 'Convexo' ? 12 * factor : 2 * factor;
            let tBorde = state.lens === 'Convexo' ? 2 * factor : 12 * factor;
            tCentro = Math.max(tCentro, 2); tBorde = Math.max(tBorde, 2);

            ctx.fillStyle = 'rgba(133, 193, 233, 0.6)';
            ctx.strokeStyle = '#2980B9';
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            ctx.moveTo(px(0), py(h_obj*2.5));
            // Curva derecha
            ctx.quadraticCurveTo(px(0) + tCentro, py(0), px(0), py(-h_obj*2.5));
            // Borde inferior
            ctx.lineTo(px(0) - tBorde/2, py(-h_obj*2.5));
            // Curva izquierda
            ctx.quadraticCurveTo(px(0) - tCentro, py(0), px(0) - tBorde/2, py(h_obj*2.5));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Eje del lente
            ctx.beginPath(); ctx.moveTo(px(0), py(h_obj*2.6)); ctx.lineTo(px(0), py(-h_obj*2.6)); 
            ctx.strokeStyle = 'rgba(41, 128, 185, 0.3)'; ctx.stroke();
        }

        // Utilidad para dibujar flechas
        function drawArrow(ctx, fromx, fromy, tox, toy, color, width) {
            let headlen = 10; // longitud de la cabeza
            let dx = tox - fromx;
            let dy = toy - fromy;
            let angle = Math.atan2(dy, dx);
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();
        }

        // ══════════════════════════════════════════════════════════
        // PANEL DE TEXTO (Pestañas)
        // ══════════════════════════════════════════════════════════
        function renderPanel() {
            const container = document.getElementById('tab-content');
            const p = state.physics;
            let html = '';

            if (state.tab === 'datos') {
                html = `
                    <h3 class="text-center font-bold text-[#2980B9] border-b pb-2 mb-4 uppercase text-sm tracking-wide">Tabla de Mediciones</h3>
                    
                    <div class="mb-4">
                        <h4 class="font-bold text-gray-700 mb-2">Parámetros del Sistema</h4>
                        <div class="grid grid-cols-2 gap-2 text-sm font-mono text-gray-600 bg-gray-50 p-2 rounded">
                            <span>Distancia objeto:</span> <span class="text-right text-gray-900 font-bold">so = ${p.so.toFixed(2)} cm</span>
                            <span>Distancia focal:</span> <span class="text-right text-gray-900 font-bold">f = ${p.f.toFixed(2)} cm</span>
                            <span>Posición pantalla:</span> <span class="text-right text-gray-900 font-bold">xs = ${state.xs.toFixed(2)} cm</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h4 class="font-bold text-[#27AE60] mb-2">Resultados Calculados</h4>
                        <div class="grid grid-cols-2 gap-2 text-sm font-mono text-gray-600 bg-green-50 p-2 rounded">
                            <span>Distancia imagen:</span> <span class="text-right text-gray-900 font-bold">si = ${p.si === Infinity ? '∞' : p.si.toFixed(2)} cm</span>
                            <span>Magnificación:</span> <span class="text-right text-gray-900 font-bold">M = ${p.M.toFixed(3)}</span>
                            <span>Desfase enfoque:</span> <span class="text-right text-gray-900 font-bold">Δx = ${p.isReal ? p.deltaX.toFixed(2) : '∞'} cm</span>
                        </div>
                    </div>

                    <div>
                        <h4 class="font-bold text-gray-700 mb-2">Clasificación</h4>
                        <div class="grid grid-cols-2 gap-2 text-sm bg-gray-50 p-2 rounded text-gray-700">
                            <span>Tipo:</span> <span class="text-right font-bold">${p.isReal ? 'Real (proyectable)' : 'Virtual (no proyectable)'}</span>
                            <span>Orientación:</span> <span class="text-right font-bold">${p.M < 0 ? 'Invertida' : 'Derecha'}</span>
                            <span>Tamaño:</span> <span class="text-right font-bold">${Math.abs(p.M) > 1 ? 'Aumentada' : 'Reducida'}</span>
                        </div>
                    </div>
                `;
            } 
            else if (state.tab === 'analisis') {
                if (p.isReal) {
                    html = `
                        <h3 class="text-center font-bold text-[#27AE60] border-b pb-2 mb-4 uppercase text-sm">Lente Convexo — Imagen Real</h3>
                        <div class="space-y-3 text-sm text-gray-700 leading-relaxed text-justify">
                            <p>Los rayos de luz que atraviesan las zonas transparentes del acetato original convergen físicamente en un punto exacto ubicado a la distancia <span class="font-bold">si = ${p.si.toFixed(1)} cm</span>.</p>
                            <p>Si la pantalla se coloca exactamente en ese punto, se observará una imagen <strong class="text-green-600">NÍTIDA</strong> (alto contraste entre la tinta y la luz).</p>
                            <p>Si la pantalla se mueve lejos de ese punto ideal, los rayos comienzan a separarse nuevamente formando "círculos de confusión", lo que visualmente se percibe como una imagen <strong class="text-red-500">BORROSA</strong>.</p>
                            <p class="bg-blue-50 p-2 rounded border border-blue-100">La imagen real siempre estará <strong>INVERTIDA</strong> en el eje vertical y horizontal, tal como se puede apreciar en el comparativo visual.</p>
                        </div>
                    `;
                } else {
                    html = `
                        <h3 class="text-center font-bold text-[#E67E22] border-b pb-2 mb-4 uppercase text-sm">Imagen Virtual — No Proyectable</h3>
                        <div class="space-y-3 text-sm text-gray-700 leading-relaxed text-justify">
                            <p>Debido a la configuración actual (Lente Cóncavo, o un objeto muy cerca del Lente Convexo), los rayos de luz <strong>divergen</strong> al salir del cristal.</p>
                            <p>Al no converger físicamente en el espacio detrás del lente, es <strong class="text-red-500">imposible</strong> proyectar una imagen nítida sobre una pantalla física.</p>
                            <p>Para el ojo humano mirando a través del lente, parece que la luz proviene de una imagen ubicada del mismo lado que el objeto original. Esta es la "Imagen Virtual".</p>
                            <p class="bg-orange-50 p-2 rounded border border-orange-100">En la pantalla física solo se observará una <strong>SOMBRA DIFUSA</strong> del objeto bloqueando la luz, la cual se hará más grande y borrosa cuanto más lejos se ubique la pantalla.</p>
                        </div>
                    `;
                }
            } 
            else if (state.tab === 'ecuaciones') {
                html = `
                    <h3 class="text-center font-bold text-[#2C3E50] border-b pb-2 mb-4 uppercase text-sm">Ecuaciones Ópticas</h3>
                    
                    <div class="mb-5">
                        <p class="text-xs text-gray-500 mb-1">Ecuación de la lente delgada:</p>
                        <div class="bg-[#EBF5FB] border border-[#AED6F1] rounded-lg py-4 text-center text-lg font-serif">
                            <div class="frac"><span>1</span><span class="bottom">f</span></div> =
                            <div class="frac"><span>1</span><span class="bottom">s<sub>o</sub></span></div> +
                            <div class="frac"><span>1</span><span class="bottom">s<sub>i</sub></span></div>
                        </div>
                    </div>

                    <div class="mb-5">
                        <p class="text-xs text-gray-500 mb-1">Magnificación lineal:</p>
                        <div class="bg-[#EBF5FB] border border-[#AED6F1] rounded-lg py-3 text-center text-lg font-serif">
                            M = - <div class="frac"><span>s<sub>i</sub></span><span class="bottom">s<sub>o</sub></span></div> = 
                            <div class="frac"><span>h<sub>i</sub></span><span class="bottom">h<sub>o</sub></span></div>
                        </div>
                    </div>

                    <div class="mb-5">
                        <p class="text-xs text-gray-500 mb-1">Distancia imagen (fórmula despejada):</p>
                        <div class="bg-[#EBF5FB] border border-[#AED6F1] rounded-lg py-3 text-center text-lg font-serif">
                            s<sub>i</sub> = <div class="frac"><span>f · s<sub>o</sub></span><span class="bottom">s<sub>o</sub> - f</span></div>
                        </div>
                    </div>

                    <div class="bg-[#F9F9F9] border border-[#BDC3C7] rounded p-3 text-xs font-mono text-gray-600 leading-relaxed">
                        <span class="font-bold text-gray-800">Convenio de signos:</span><br>
                        f > 0  → Convexo (convergente)<br>
                        f < 0  → Cóncavo (divergente)<br>
                        si > 0 → Imagen real (proyectable)<br>
                        si < 0 → Imagen virtual<br>
                        M < 0  → Imagen invertida<br>
                        |M| > 1 → Imagen aumentada
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // ══════════════════════════════════════════════════════════
        // CICLO PRINCIPAL
        // ══════════════════════════════════════════════════════════
        function updateAll() {
            // Leer inputs
            state.so = parseFloat(inputs.so.value);
            state.fMag = parseFloat(inputs.f.value);
            state.xs = parseFloat(inputs.xs.value);
            state.lens = inputs.lens.value;
            state.obj = inputs.obj.value;

            // Actualizar labels visuales de sliders
            labels.so.innerText = state.so.toFixed(1) + ' cm';
            labels.f.innerText  = state.fMag.toFixed(1) + ' cm';
            labels.xs.innerText = state.xs.toFixed(1) + ' cm';

            // Computar y renderizar
            calculatePhysics();
            renderBench();
            renderFrontViews();
            renderPanel();
        }

        // ══════════════════════════════════════════════════════════
        // EVENT LISTENERS E INICIALIZACIÓN
        // ══════════════════════════════════════════════════════════
        
        // Listeners para controles
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updateAll);
            input.addEventListener('change', updateAll);
        });

        // Listeners para pestañas
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Actualizar estilo visual
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('text-[#2980B9]', 'bg-white', 'border-[#2980B9]');
                    b.classList.add('text-gray-500', 'hover:bg-gray-50', 'border-transparent');
                });
                const t = e.target;
                t.classList.remove('text-gray-500', 'hover:bg-gray-50', 'border-transparent');
                t.classList.add('text-[#2980B9]', 'bg-white', 'border-[#2980B9]');
                
                // Actualizar estado y renderizar
                state.tab = t.getAttribute('data-tab');
                renderPanel();
            });
        });

        // Ajuste de tamaño responsive
        window.addEventListener('resize', () => {
            resizeCanvases();
            updateAll();
        });

        // Arranque Inicial
        resizeCanvases();
        updateAll();

    </script>
</body>
</html>
